[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-simulator"
version = "1.0.0"
description = "Real-Scale Earth-Moon Orbital Dynamics, PINN Surrogate & Experimentation Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["leo_simulator*"]
