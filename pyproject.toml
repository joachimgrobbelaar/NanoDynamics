[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodynamics"
version = "1.1.0"
description = "Astrodynamics library: SGP4/TEME, frame transforms, and a numerical LEO propagator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sgp4>=2.20",
]

[project.optional-dependencies]
simulator = [
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pytest>=7.0.0",
]
data = [
    "datasets>=2.14.0",
    "pyarrow>=12.0.0",
    "huggingface-hub>=0.19.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["nanodynamics*", "leo_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
