version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanodynamics-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nanodynamics-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanodynamics-worker
    restart: unless-stopped
    command: python -m workers.background_tasks
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    networks:
      - nanodynamics-net

networks:
  nanodynamics-net:
    driver: bridge
