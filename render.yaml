services:
  - type: web
    name: nanodynamics-backend
    env: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_UNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: "production"
      - key: PORT
        value: "8000"
