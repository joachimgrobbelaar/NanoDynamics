[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = sebastianregelmann/tflite-micro@^1.0.3
monitor_speed = 115200

[env:esp32_gateway]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = sebastianregelmann/tflite-micro@^1.0.3
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags =
    -D NODE_ROLE_GATEWAY=1
    -D WIFI_CHANNEL=1
    -D LED_PIN=2

[env:esp32_pinn_edge]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = sebastianregelmann/tflite-micro@^1.0.3
monitor_speed = 115200
upload_port = /dev/ttyUSB1
build_flags =
    -D NODE_ROLE_PINN_EDGE=1
    -D LED_PIN=2


