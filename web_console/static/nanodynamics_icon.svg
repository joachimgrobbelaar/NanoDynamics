<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0D1F3D" />
      <stop offset="65%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#03050A" />
    </radialGradient>
    <linearGradient id="planetGrad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="orbitGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD21E" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Dark Space Chassis -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGlow)" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.45" />

  <!-- Subtle Starfield -->
  <circle cx="48" cy="54" r="1.5" fill="#E2E8F0" opacity="0.8" />
  <circle cx="204" cy="48" r="2" fill="#00E5FF" opacity="0.9" />
  <circle cx="62" cy="198" r="1.5" fill="#FFD21E" opacity="0.7" />
  <circle cx="210" cy="188" r="1.8" fill="#00FF66" opacity="0.8" />

  <!-- Cislunar / SymplecticPINN Manifold Ring 2 -->
  <ellipse cx="128" cy="128" rx="96" ry="38" transform="rotate(32 128 128)" fill="none" stroke="url(#orbitGold)" stroke-width="3.5" stroke-dasharray="6 4" filter="url(#neonGlow)" />

  <!-- Central Planetary Sphere with Atmospheric Rim -->
  <circle cx="128" cy="128" r="46" fill="url(#planetGrad)" stroke="#00E5FF" stroke-width="2" filter="url(#neonGlow)" />

  <!-- Neural PINN Mesh Nodes inside Planet -->
  <g stroke="#E0F2FE" stroke-width="1.2" opacity="0.65">
    <line x1="108" y1="112" x2="128" y2="98" />
    <line x1="128" y1="98" x2="148" y2="114" />
    <line x1="108" y1="112" x2="128" y2="128" />
    <line x1="148" y1="114" x2="128" y2="128" />
    <line x1="128" y1="128" x2="114" y2="148" />
    <line x1="128" y1="128" x2="144" y2="148" />
  </g>
  <circle cx="128" cy="98" r="3.5" fill="#00FF66" />
  <circle cx="108" cy="112" r="3.5" fill="#00E5FF" />
  <circle cx="148" cy="114" r="3.5" fill="#00E5FF" />
  <circle cx="128" cy="128" r="4.5" fill="#FFD21E" />
  <circle cx="114" cy="148" r="3.5" fill="#00FF66" />
  <circle cx="144" cy="148" r="3.5" fill="#00FF66" />

  <!-- Primary LEO Trajectory Ring -->
  <ellipse cx="128" cy="128" rx="102" ry="42" transform="rotate(-28 128 128)" fill="none" stroke="url(#orbitCyan)" stroke-width="5" filter="url(#neonGlow)" />

  <!-- CubeSat Spacecraft Icon on Orbit -->
  <g transform="translate(198, 76) rotate(-28)">
    <rect x="-18" y="-5" width="10" height="10" fill="#0284C7" stroke="#00E5FF" stroke-width="1.2" />
    <rect x="8" y="-5" width="10" height="10" fill="#0284C7" stroke="#00E5FF" stroke-width="1.2" />
    <rect x="-6" y="-7" width="12" height="14" rx="2" fill="#F8FAFC" stroke="#00FF66" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.5" fill="#00FF66" />
  </g>

  <!-- Bottom HUD Badge: ND // HIL -->
  <rect x="68" y="206" width="120" height="24" rx="6" fill="#05070B" stroke="#00FF66" stroke-width="1.5" />
  <text x="128" y="222" text-anchor="middle" fill="#00FF66" font-family="monospace" font-weight="bold" font-size="12" letter-spacing="2">ND // PINN HIL</text>
</svg>
