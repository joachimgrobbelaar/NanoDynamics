name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Do not push this repository onto the OrbitGuard Space
        run: |
          echo "NanoDynamics is deployable as its own Docker Space (Dockerfile, port 7860)."
          echo "This workflow does not push to the OrbitGuard Space."
