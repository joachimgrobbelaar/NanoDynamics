name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Orbital Mechanics & OrbitGuard AI)
        run: |
          export PYTHONPATH=.
          pytest tests/test_nanodynamics_pipeline.py -v

  notify-telegram:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Telegram Deployment Alert
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            NanoDynamics tests passed on main.
            • Simulator: visualization_3d.app on port 7860 in the Docker Space
            • Physics package: nanodynamics.elements, frames, propagation
            • OrbitGuard is a separate repository and is not deployed from here.
