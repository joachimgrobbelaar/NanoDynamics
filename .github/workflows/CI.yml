name: Nanodynamics-v3 CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml torch fastapi uvicorn httpx pytest ruff
      - name: Run Ruff Linter
        run: ruff check src/ tests/ web_console/
      - name: Run Pytest Suite (TRL 1-6 Verification)
        run: PYTHONPATH=. pytest -v tests/
